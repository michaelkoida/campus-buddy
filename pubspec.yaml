name: campus_buddy_rcub
description: A production-grade multi-tenant enterprise mobile application for campus networks optimized for low-end 2GB RAM devices.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0      # Updated to v3
  firebase_auth: ^5.0.0      # Updated to v5
  cloud_firestore: ^5.0.0    # Updated to v5
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  flutter_paystack: ^1.0.7
  provider: ^6.1.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
    - assets/rsu_logo.png
    - assets/uniport_logo.png