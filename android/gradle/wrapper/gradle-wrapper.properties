distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
# Enable parallel execution for independent tasks
org.gradle.parallel=true

# Keep the Gradle daemon alive so it doesn't start from scratch every time
org.gradle.daemon=true

# Enable local build caching to reuse previous build outputs
org.gradle.caching=true

# Enable configuration caching to skip setup steps
org.gradle.configuration-cache=true

# Allocate more memory to Gradle for faster processing
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8